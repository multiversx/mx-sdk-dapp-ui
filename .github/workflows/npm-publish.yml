name: Publish sdk-dapp-ui

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          clean: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Setup pnpm
        run: npm install -g pnpm
      - name: Install Chrome for Puppeteer
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      - name: Clear dist
        run: rm -rf dist
      - name: Build
        run: pnpm run build

      - name: Get package info
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Publish to npmjs next version
        if: ${{ steps.package.outputs.prerelease == 'true' }}
        run: npm publish --tag next

      - name: Publish to npmjs
        if: ${{ steps.package.outputs.prerelease == 'false' }}
        run: npm publish

      - name: Create GitHub Release
        if: ${{ steps.package.outputs.prerelease == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          RELEASE_TAG="v$VERSION"
          echo "Creating release for version: $RELEASE_TAG"

          changelog_content=$(awk "/^## \[\[?${VERSION}[^\]]*\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)

          cat > release_notes.md << EOF
          ## What's Changed

          $changelog_content
          EOF

          gh release create "$RELEASE_TAG" \
            --target="$GITHUB_SHA" \
            --title="$RELEASE_TAG" \
            --notes-file release_notes.md
